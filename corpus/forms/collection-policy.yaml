# WHICH FORM STANDARD DO WE COLLECT TO?
#
# ---------------------------------------------------------------------------
# THE SWITCH — change this one value when the PVQ fully launches.
# ---------------------------------------------------------------------------
collection_standard: sf86
pvq_status: not_fully_launched

standard_switch_note: |
  When the PVQ is fully in force, change `collection_standard` to `pvq` and
  bump corpus/VERSION. Nothing else in the repo needs editing — the agents
  read this value. That is the whole point of it being one line.

# ---------------------------------------------------------------------------
# WHY SF-86 IS THE DEFAULT RIGHT NOW
# ---------------------------------------------------------------------------
rationale: |
  The Personnel Vetting Questionnaire is the Trusted Workforce 2.0 replacement
  for the SF-86, but it has not fully launched. Most people filing today filed
  an SF-86, and the criteria their matter will be measured against are the
  SF-86 criteria. Telling someone their report is being built to a form they
  have not filed and may not file is confusing and, for the thresholds below,
  actively wrong.

  So the tool says plainly: "you most likely have to report against the SF-86
  criteria," and builds to those.

# ---------------------------------------------------------------------------
# THE TWO FORMS DIFFER IN WAYS THAT CHANGE ANSWERS. This is not cosmetic.
# ---------------------------------------------------------------------------
# Derived from the form text in the DCSA Library:
#   SF-86 (Nov 2016 rev, 2017 printing) Section 22 — Police Record
#   PVQ (Final, Sept 2023) Part B Section 11 — Police Record
# UNVERIFIED until a maintainer checks each row against those sources.
material_differences:
  criminal_lookback:
    sf86: "7 years"
    pvq: "5 years"
    consequence: "An event 6 years old is in scope for the SF-86 and out of scope for the PVQ. Getting this wrong produces either an omission or an unnecessary disclosure."
  traffic_fine_threshold:
    sf86: "under $300, and no alcohol or drugs"
    pvq: "under $1,000, and no alcohol or drugs"
    consequence: "A $500 traffic fine is reportable on the SF-86 and not on the PVQ."
    note: "Both forms carve out traffic violations ONLY where alcohol and drugs were not involved. An OWI is never inside this carve-out at any amount."
  agency_and_court_address:
    sf86: "City, County, State, ZIP"
    pvq: "Full street address including unit/suite, City, State, ZIP"
    consequence: "The PVQ needs more. Collect the fuller version — see collect_superset."
  separate_arresting_agency:
    sf86: "not asked separately"
    pvq: "explicitly asks whether the agency that arrested you is the same one that cited you, and collects the second agency in full if not"
    consequence: "A small-town officer citing you and a county sheriff booking you is TWO agencies. The PVQ asks; the SF-86 does not. Collect both regardless."
  juvenile_carveout:
    pvq: "omit violations before the 18th birthday finally decided in juvenile court"
  ucmj:
    pvq: "military charges under the UCMJ go in Part B Section 9, not the police record section"

# ---------------------------------------------------------------------------
# COLLECT THE SUPERSET, REPORT TO THE STANDARD
# ---------------------------------------------------------------------------
collect_superset: true
collect_superset_rule: |
  Where the two forms ask for the same fact at different depth, COLLECT THE
  DEEPER ONE and present against the current standard.

  Concretely: gather the full street address of a court or a law enforcement
  agency even though the SF-86 only asks for city/county/state/ZIP. It costs
  the user nothing — these are public organisations, exempt from the privacy
  tiers — and it means the FSO can actually contact them, and that a PVQ filing
  later needs no second interview.

  This does NOT extend to thresholds or lookback windows. Those are not depth,
  they are scope, and applying the wrong one produces a wrong answer. Use the
  standard's own threshold and say which you used.

position_type_required: false   # derived as national_security from scope; never asked

user_notice: |
  "One thing worth saying up front. There are two questionnaires in circulation
  right now — the SF-86, which is what most people have filed, and the PVQ,
  which is replacing it but hasn't fully launched.

  I'm going to work to the SF-86 criteria, because that's most likely what
  yours will be measured against. Where the PVQ asks for something extra I'll
  collect it anyway, so you're not doing this twice later. If your security
  office tells you you're on the PVQ, say so and I'll switch."
