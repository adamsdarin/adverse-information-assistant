# Guideline ↔ Personnel Vetting Questionnaire (PVQ) FIELD-LEVEL map.
#
# *** THIS IS THE COLLECTION STANDARD FOR EVERY USER. ***
# See collection-policy.yaml. The PVQ governs what the tool ASKS FOR,
# regardless of which form the user actually filed. The form the user filed
# governs only what the package CITES BACK TO.
#
# PROVENANCE — read this before trusting anything below:
#   sections, titles, and field questions: EXTRACTED from the maintainer's
#     PVQ source documents (Final, September 2023), marked "For Reference
#     Only". Not transcribed from memory, not inferred.
#   guideline_mapping: MAINTAINER INFERENCE. Which SEAD 4 guideline a PVQ
#     section serves is an editorial judgment, not something the form states.
#     Review these before relying on them.
#   Field lists are the adverse-information-relevant fields, not a complete
#     transcription of every address subfield and repeat-instance prompt.
#
# NOTE ON SOURCE FILES: in the maintainer's upload, the file named
# "PVQ_Part_A" contains Part B and the file named "PVQ_Part_B" contains
# Part A. Mapping below follows CONTENT, not filename.

populated: true
maintainer_verified: false        # flip after reviewing guideline_mapping
source: "Personnel Vetting Questionnaire, Final September 2023 (Parts A-D + Certification and Releases)"
source_note: "Documents marked 'For Reference Only'. Verify against the authoritative issuance before production use."
sections_source: extracted
guideline_mapping_source: inference_review_required

# ---------------------------------------------------------------------------
# PART APPLICABILITY — which Parts a given user must satisfy.
# This is a new intake dimension: position type, not just clearance tier.
# ---------------------------------------------------------------------------
parts:
  A:
    title: "Part A - Mandatory for All Positions"
    applies_to: all_positions
  B:
    title: "Part B - Mandatory for All Positions Except Low Risk"
    applies_to: all_except_low_risk
  C:
    title: "Part C - Mandatory for all National Security Positions"
    applies_to: national_security_positions
  D:
    title: "Part D - Public Trust-Specific (Select Positions)"
    applies_to: public_trust_select

# THIS TOOL ONLY EVER USES national_security. Everyone in scope holds, or is in
# process for, eligibility for access to classified information — which is a
# national security position by definition. The other two rows are retained so
# the mapping stays a faithful record of the form, and for a possible future
# suitability mode; nothing in the current flow selects them, and intake does
# not ask. A session carrying anything else is a scope error, not a variation.
position_type_to_parts:
  national_security: [A, B, C]      # the only path this tool uses
  public_trust: [A, B, D]           # out of scope — not clearance-holding
  low_risk: [A]                     # out of scope — not clearance-holding

# ---------------------------------------------------------------------------
# SCOPING — the PVQ's lookback windows. These differ from the SF-86 and are
# load-bearing: asking without the window produces over- or under-collection.
# ---------------------------------------------------------------------------
default_lookback: "past five years"
scope_notes:
  five_years_or_since_16: "Alcohol (19) and drug/controlled-substance (12) questions use 'in the past five years or since the age of 16, whichever is shorter'."
  marijuana_90_days: "Section 13 asks about marijuana/cannabis use in the LAST 90 DAYS, plus 'ever' for use while in a national security or criminal justice/public safety position."
  ever_questions: "Some questions are lifetime scope regardless of the five-year default — notably Sections 14 (clearance granted/suspended/revoked), 18 (violent-overthrow organization membership), 28 (court-ordered mental incompetency), and 29 (convictions with sentences over one year)."

# ---------------------------------------------------------------------------
# SECTIONS
# ---------------------------------------------------------------------------
