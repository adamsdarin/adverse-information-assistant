# ---------------------------------------------------------------------------
# CERTIFICATION — governs the whole form and this tool's candor posture.
# ---------------------------------------------------------------------------
certification:
  source: "PVQ Certification and Releases, Final September 2023"
  false_statement_penalty: "18 U.S.C. § 1001 — knowing and willful false statement punishable by fine or imprisonment or both"
  classified_information_affirmation: "The signer affirms they have not included any classified information in completing the questionnaire."
  consequences_language: "Intentional withholding, misrepresenting, falsifying, or including classified information may negatively affect clearance, employment prospects, or job status, up to denial or revocation, or removal or debarment from Federal service."
  tool_use: |
    This is the authoritative basis for the tool's candor rules. When a user
    signals intent to omit or minimize, the Triage agent may cite the
    certification the user will personally sign — not as a threat, but
    because it is the actual standard they are being held to.
