  # =========================================================== I ==========
  I:
    always_state: >
      Seeking mental-health care is not itself disqualifying, and the guide's
      document list is about a condition's management, not its existence. Say
      so with any document guidance under this guideline.
    statement_must_address:
      - "What the condition is and how it is being managed, in the user's words"
      - "What happened, and who first raised it — the user, a co-worker, the command"
      - "Any local step the organisation took at the time, such as an access restriction"
    documents:
      - type: "Employer or command records of any administrative action — non-judicial punishment, memorandum for record, letters of counselling or reprimand, user activity monitoring reports, counselling logs"
        retrieval_ref: [security-office-record]
        custodian: "the employer or command, via the security office"
        obtain_by: security_office
        purpose: "what the organisation did and observed"
        applies_when: "the employer or command took action"
      - type: "Records of any local mitigation — facility access restriction or a local suspension of access"
        retrieval_ref: [security-office-record]
        custodian: "the security office"
        obtain_by: security_office
        purpose: "what was done to manage risk at the time"
        applies_when: "access was restricted or suspended locally"
      - type: "Emergency-room and inpatient records, and any police or emergency-medical report connected to a hospitalisation"
        retrieval_ref: [medical-records, police-report, ems-report]
        custodian: "the hospital; the responding agency"
        obtain_by: subject
        purpose: "the record of a voluntary or involuntary hospitalisation"
        applies_when: "a hospitalisation occurred"
        all_pages: true
      - type: "Medical records and clinical progress notes showing the treatment plan is being followed"
        retrieval_ref: [medical-records]
        custodian: "the treating provider"
        obtain_by: subject
        purpose: "diagnosis, treatment and adherence over time"
        applies_when: "the user is or was in treatment"
        all_pages: true
      - type: "Pharmacy records showing consistent prescription refills"
        retrieval_ref: [pharmacy-fill-history]
        custodian: "the dispensing pharmacy"
        obtain_by: subject
        purpose: "adherence to prescribed medication, independently recorded"
        applies_when: "medication is prescribed"
      - type: "Completion certificates for any ordered or voluntary programme — stress management, anger management, structured counselling"
        retrieval_ref: [treatment-completion-certificate]
        custodian: "the programme provider"
        obtain_by: subject
        purpose: "that the programme was completed"
        applies_when: "a programme was ordered or undertaken"

  # =========================================================== J ==========
  J:
    statement_must_address:
      - "The exact details, timeline and context of the arrest or conduct"
      - "Whether a formal investigation is open, by which agency, and under what case or report number"
      - "Whether the user is currently in custody or subject to an active warrant"
      - "Where drugs or alcohol are involved: quantity, frequency and types, current status, future intent, and any recovery plan"
    documents:
      - type: "Police records — arrest reports, incident reports, investigation notes, complaints or indictments"
        retrieval_ref: [police-report, state-criminal-history]
        custodian: "the arresting or investigating agency"
        obtain_by: subject
        purpose: "the official account of the incident"
      - type: "The investigating agency's report of investigation, where one exists, with its case or tracking number"
        retrieval_ref: [investigation-report]
        custodian: "the investigating agency (local police, military criminal investigators)"
        obtain_by: either
        purpose: "lets the adjudicator follow a live investigation rather than wait for it"
        applies_when: "a formal investigation is or was open"
      - type: "Court records — dockets, summons, plea agreement, final disposition, sentencing order, probation agreement or discharge"
        retrieval_ref: [court-record]
        custodian: "the clerk of the court that heard the matter"
        obtain_by: subject
        purpose: "charge, plea, sentence and dates"
        applies_when: "charges were filed"
      - type: "Proof every court-ordered requirement was completed — probation completion letter, community-service logs, receipts for fines, fees or restitution, a zero-balance ledger, completion certificates for any ordered or voluntary programme"
        retrieval_ref: [sentence-completion-proof]
        custodian: "the probation office, the court and the programme providers"
        obtain_by: subject
        purpose: "sentence completion, item by item"
        applies_when: "a sentence or conditions were imposed"
