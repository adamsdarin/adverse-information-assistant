# What DCSA's adjudicators say a complete incident report contains — the
# "Adjudicatively Ready Product" standard, restated in this corpus's own
# structure so the agents can measure a package against it.
#
# ===========================================================================
# WHAT THIS FILE IS AND IS NOT
# ===========================================================================
# DCSA publishes a reference guide for security officers on what an incident
# report must carry so the adjudicator can act on it without asking for more.
# It has three parts the tool can use directly:
#
#   1. a definition of "adjudicatively ready", and a timeline rule — report
#      now, never wait for paperwork, and SAY which documents are still coming;
#   2. the shape of a complete incident picture and a complete subject
#      statement — the factors the statement must address;
#   3. per-guideline lists of the supporting documentation the adjudicator
#      expects to find in the file.
#
# This file is NOT the guide's text. It is the maintainer's restatement of its
# requirements, in the tool's own vocabulary (coverage facets, element ids,
# custodians), authored so each requirement can be cross-checked by
# validate_corpus.py against the checklists that are supposed to satisfy it.
# Anyone can read the guide at source_url and compare; that is the point of
# recording the URL and the retrieval date.
#
# It is NOT evidence of how any case is decided, and it says nothing about
# outcomes. _DOCUMENT_EVIDENCE.yaml records what DOHA judges weighed and why;
# this file records what the intake adjudicator wants in the file on day one.
# The documents advisor reads both: this one for the baseline list, that one
# for weight and for the words to explain why a document matters.
#
# ===========================================================================
# AUDIENCE TRANSLATION — the single most important thing to understand here
# ===========================================================================
# The guide is written for the security officer who SUBMITS the report, and
# calls the person reported on "the Subject". This tool serves the Subject,
# preparing a self-report before approaching that security officer. So every
# document below carries `obtain_by`:
#
#   subject          — the user can go and get it (their own court record,
#                      bank statement, treatment letter, passport copy)
#   security_office  — it exists only in the security office's own files
#                      (a preliminary inquiry, a violation notice, a user
#                      activity monitoring report). The user is never sent to
#                      fetch these. The package NAMES them so the user can tell
#                      their security office the record exists and belongs in
#                      the submission.
#   either           — the user may hold a copy and the security office may
#                      also; whoever has it attaches it.
#
# Nothing here changes the tool's own rules: no system the user cannot access
# is ever presented as theirs to use, nothing is obtained about another
# person, and the report never waits for any of it.
schema_version: "1.0"
maintainer_verified: false
source_url: "https://www.dcsa.mil/Trust-Decision-Adjudications/Adjudicatively-Ready-Product-Reference-Guide/"
source_title: "DCSA, Trust Decision (Adjudications) — Adjudicatively Ready Product Reference Guide"
retrieved: "2026-11-09"
