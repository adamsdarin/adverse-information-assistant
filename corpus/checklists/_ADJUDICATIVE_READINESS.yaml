        retrieval_ref: [custody-release-record]
        custodian: "the correctional facility"
        obtain_by: subject
        purpose: "the dates of any incarceration and release"
        applies_when: "the user was incarcerated"
      - type: "Command action records — memorandum for record, letters of reprimand, counselling or admonishment, access determinations, non-judicial punishment, command correspondence, or a record that no action was taken"
        retrieval_ref: [security-office-record, command-personnel-record]
        custodian: "the command, via the security office"
        obtain_by: security_office
        purpose: "what the command did, including a documented decision to do nothing"
        applies_when: "the user is or was in a military command"

  # =========================================================== K ==========
  K:
    statement_must_address:
