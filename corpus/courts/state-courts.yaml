# State court recognition aid — WHICH COURT WAS IT?
#
# PURPOSE, AND THE LIMIT ON IT
# ----------------------------
# This is a MEMORY AID, not a jurisdiction determination. People routinely do
# not know which court heard their case: they were arrested, a lawyer told them
# where to show up, they paid a fine, and the court's name never registered.
# That is ordinary, not careless.
#
# So the interviewer ASKS FIRST — "what court did your case go through?" — and
# only if the user does not know does it offer a nudge:
#
#     "In Iowa that's usually the Iowa District Court for the county you were
#      arrested in — would that be Black Hawk County District Court?"
#
# The user confirms or corrects. WHAT GETS RECORDED IS ALWAYS THE USER'S
# ANSWER, never this file's guess. If they still don't know, the honest fallback
# is: contact the clerk in the county where it happened.
#
# THIS IS NOT LEGAL ADVICE and it is not a statement of jurisdiction. It is
# directory information offered to jog a memory. Court structures change, and a
# nudge that is wrong costs a phone call — a nudge presented as an answer costs
# trust.
#
# VERIFICATION
# ------------
# Every state ships `verified: false`. Until a human checks it against that
# state's official judiciary site, the agents may not assert it — they may only
# offer it explicitly as a guess, or skip the nudge entirely. Setting
# `verified: true` requires `source_url` and `verified_date`; validate_corpus.py
# errors otherwise.
#
# FIELD REFERENCE
# ---------------
#   trial_court_felony    court that hears felony criminal matters
#   trial_court_misdemeanor  court that hears misdemeanors (often different!)
#   organized_by          the geographic unit courts are organized around
#   unit_label            what that unit is CALLED (County / Parish / Borough)
#   lower_courts          municipal/city/justice courts below the trial court —
#                         this is the fork that most often confuses people
#   records_custodian     the title to ask for. Wrong title = transferred twice
#   statewide_portal      online case search, if the state has one
#   judiciary_url         the official source of truth
#   dui_note              where OWI/DUI specifically lands, when it differs
#   notes                 anything that trips people up

schema_version: "1.0"
maintainer_verified: false
purpose: recognition_aid_only
authoritative_source: "each state's own judiciary website (judiciary_url)"

cross_check_sources:
  - name: "NCSC State Court Structure Charts"
    url: "https://www.ncsc.org/resources-courts/understanding-state-court-jurisdictions"
    note: "Per-state hierarchy charts. Canonical, but PDFs and recently reorganized on NCSC's site."
  - name: "BJS Census of State Court Organization"
    url: "https://bjs.ojp.gov/data-collection/census-state-court-organization"
    note: "Most detailed structured data and public domain, but last collected 2011. Cross-check only; do not rely on alone."

do_not_use:
  - name: "CourtReference.com and similar aggregators"
    reason: |
      Commercial (Intelius), explicitly not an official source, and its terms
      restrict reuse for FCRA-adjacent purposes. This tool serves clearance
      holders — too close to background screening to redistribute that data.

