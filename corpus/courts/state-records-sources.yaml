    url: "https://www.annualcreditreport.com/"
    for: "Guideline F: the updated credit bureau report, all pages"
  - id: dispute-equifax
    label: "Equifax — file a dispute"
    url: "https://www.equifax.com/personal/credit-report-services/credit-dispute/"
    for: "Guideline F: disputed accounts"
  - id: dispute-experian
    label: "Experian — file a dispute"
    url: "https://www.experian.com/disputes/main.html"
    for: "Guideline F: disputed accounts"
  - id: dispute-transunion
    label: "TransUnion — file a dispute"
    url: "https://www.transunion.com/credit-disputes/dispute-your-credit"
    for: "Guideline F: disputed accounts"
  - id: pacer
    label: "PACER — federal court records, including every bankruptcy court"
    url: "https://pacer.uscourts.gov/"
    for: "Guideline F: bankruptcy petition schedules and the discharge order; federal criminal dockets"
  - id: bankruptcy-basics
    label: "U.S. Courts — bankruptcy basics and court locator"
    url: "https://www.uscourts.gov/court-programs/bankruptcy"
    for: "Guideline F: which bankruptcy court holds the case"
  - id: credit-counseling
    label: "U.S. Trustee Program — approved credit counseling agencies"
    url: "https://www.justice.gov/ust/list-credit-counseling-agencies-approved-pursuant-11-usc-111"
    for: "Guideline F: accredited financial counseling"
  - id: fbi-identity-history
    label: "FBI — Identity History Summary Check (your own national criminal history)"
    url: "https://www.fbi.gov/how-we-can-help-you/more-fbi-services-and-information/identity-history-summary-checks"
    for: "Guidelines D, G, H, J: a national record of arrests and dispositions, useful when the state or agency is uncertain"
  - id: uscis-i90
    label: "USCIS — Form I-90, replace a Permanent Resident Card"
    url: "https://www.uscis.gov/i-90"
    for: "Guideline B: a family member's own card, if they have lost it"
  - id: uscis-n565
    label: "USCIS — Form N-565, replace a Naturalization or Citizenship Certificate"
    url: "https://www.uscis.gov/n-565"
    for: "Guidelines B, C: certificate copies"
  - id: uscis-i765
    label: "USCIS — Form I-765, Employment Authorization Document"
    url: "https://www.uscis.gov/i-765"
    for: "Guideline B: a family member's own EAD"
  - id: uscis-records
    label: "USCIS — request your own immigration records (FOIA / Privacy Act)"
    url: "https://www.uscis.gov/records/request-records-through-the-freedom-of-information-act-or-privacy-act"
    for: "Guidelines B, C: the naturalization date, when the certificate is unavailable"
  - id: cbp-i94
    label: "CBP — retrieve a Form I-94 arrival/departure record"
    url: "https://i94.cbp.dhs.gov/"
    for: "Guideline B: a family member's own I-94"
  - id: state-passport-records
    label: "State Department — passport records"
    url: "https://travel.state.gov/content/travel/en/passports/have-passport/passport-records.html"
    for: "Guideline C: record of U.S. passports issued"
  - id: state-crba
    label: "State Department — Consular Report of Birth Abroad (replacement copies)"
    url: "https://travel.state.gov/content/travel/en/international-travel/while-abroad/birth-abroad.html"
    for: "Guidelines B, C: FS-240 / DS-1350 replacement"
  - id: foreign-embassies
    label: "State Department — country information pages (foreign embassy and consulate contacts)"
    url: "https://travel.state.gov/content/travel/en/international-travel/International-Travel-Country-Information-Pages.html"
    for: "Guideline C: the foreign government's consulate, for passport surrender receipts and renunciation certificates"
  - id: nprc-military-records
    label: "National Archives — request military service records (DD Form 214 and personnel file)"
    url: "https://www.archives.gov/veterans/military-service-records"
    for: "Guideline E: discharge paperwork; court-martial and separation records in the personnel file"
  - id: milconnect
    label: "milConnect — current and recent service members' records"
    url: "https://milconnect.dmdc.osd.mil/"
    for: "Guideline E: DD Form 214 for recent separations"
  - id: hhs-medical-records
    label: "HHS — your right to access your medical records (HIPAA)"
    url: "https://www.hhs.gov/hipaa/for-individuals/medical-records/index.html"
    for: "Guidelines D, G, H, I: how to request complete records from any provider or facility"
  - id: sead-3
    label: "ODNI — Security Executive Agent Directive 3 (reporting requirements)"
    url: "https://www.dni.gov/files/NCSC/documents/Regulations/SEAD-3-Reporting-U.pdf"
    for: "The reporting obligation the guide's timeline rule rests on"

