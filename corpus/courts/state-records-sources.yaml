# Where a person obtains their OWN records — official custodians, by state.
#
# PURPOSE
# -------
# The DCSA Adjudicatively Ready Product Reference Guide (see
# checklists/_ADJUDICATIVE_READINESS.yaml) lists the documents an adjudicator
# expects behind an incident report. Several of them are held by STATE
# agencies, and which agency depends on where the matter happened:
#
#   court records              the state judiciary       -> state-courts.yaml
#   driver record              the motor-vehicle agency  -> dmv
#   state tax transcripts      the state revenue agency  -> tax
#   state criminal history     the state identification  -> criminal_history
#                              bureau (usually the state police or the
#                              attorney general's investigation bureau)
#   child-welfare records      the state child-protection agency -> child_welfare
#
# This file is the directory for the last four. state-courts.yaml remains the
# directory for courts. The documents advisor reads both and hands the user
# the right agency for their state instead of "contact the state."
#
# Everything else the guide names is either FEDERAL (IRS transcripts, PACER,
# USCIS, the State Department, military records, the FBI) -> `national`, or
# held by a specific private party (the creditor, the clinic, the employer) or
# by the user's own security office -> no directory entry is possible, and
# the agent says who holds it instead.
#
# WHAT A LINK HERE IS, AND IS NOT
# -------------------------------
# A link is the agency's own front door, deliberately shallow: deep links to
# a particular form rot within a year; an agency root does not. Each entry is
# a pointer the user follows and reads for themselves. It is NOT an assertion
# of what the agency will provide, how long it takes, or what it costs, and it
# is NOT legal advice. Every state ships `verified: false` — until a human
# confirms the agency and URL, agents offer it as "the agency that usually
# holds this" and nothing stronger.
#
# No link here has been checked by machine or by a human as of `retrieved`.
# Check them by hand, the way court_lookup.py --check-links lists the court
# URLs: this tool makes no network calls of its own. When a human confirms a
# state, set its `verified: true` with source_url and verified_date, as
# state-courts.yaml requires.
#
# DIRECT LINKS (owner direction, 2026-11-12)
# -------------------------------------------
# `url` stays the agency front door, the stable fallback. `direct_url`, where
# present, is the narrowest page found for requesting your OWN record. The
# owner accepts that deep links rot. Each direct link was opened in a browser
# on the `direct_links_checked` date; none of that marks a state verified.
# Offer the direct link first and the front door as the fallback. A `note`
# says when the record is held at county level, which is where to start.
#
# THE RULE THAT DOES NOT CHANGE
# -----------------------------
# A user retrieves records about THEMSELVES. Nothing here is ever used to look
# up another person, and the agent never asks the user to obtain a record about
# anyone else.
schema_version: "1.0"
maintainer_verified: false
retrieved: "2026-11-09"
direct_links_checked: "2026-11-12"
authoritative_source: "each agency's own website"
companion_to: "checklists/_ADJUDICATIVE_READINESS.yaml"

