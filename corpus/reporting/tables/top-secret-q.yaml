# ISL 2021-02 — ADDITIONAL reporting requirements for Top Secret / "Q" access.
# Drafted from DCSA ISL 2021-02 (v2, May 2024) Table 3. Applied ON TOP of
# all-covered-individuals.yaml. Same verification rule: unciteable until
# maintainer_verified: true.
source: "DCSA ISL 2021-02 (SEAD 3), v2, May 2024"
source_url: "https://www.dcsa.mil/Portals/128/Documents/CTP/tools/ISL2021-02_SEAD-3_052024_v2.pdf"
maintainer_verified: false
applies_to: top_secret_q
entries:
  - id: tsq.foreign-vote
    event: "Voting in a foreign election"
    reportable: "yes"
    channel_ref: diss-incident
  - id: tsq.finance.anomalies
    event: "Financial anomalies: bankruptcy; garnishment; over 120 days delinquent on any debt; unusual infusion of assets of $10,000 or greater (inheritance, winnings, similar)"
    reportable: "yes"
    channel_ref: diss-incident
    required_data_elements: [event_type, amounts, source_of_funds, dates]
  - id: tsq.foreign-business
    event: "Direct involvement in a foreign business"
    reportable: "yes"
    channel_ref: diss-incident
  - id: tsq.foreign-bank
    event: "Foreign bank account"
    reportable: "yes"
    channel_ref: diss-incident
    required_data_elements: [country, institution_type, dates]
  - id: tsq.foreign-property
    event: "Ownership interest in foreign real estate (land, permanent improvements, time-share rights)"
    reportable: "yes"
    channel_ref: diss-incident
  - id: tsq.cohabitant
    event: "Cohabitant (shared residence with bonds of affection, obligation, or other commitment)"
    reportable: "yes"
    channel_ref: diss-incident
  - id: tsq.marriage
    event: "Marriage, or legally recognized civil union / domestic partnership"
    reportable: "yes"
    channel_ref: diss-incident
  - id: tsq.adoption-foreign
    event: "Adoption of a non-U.S.-citizen child"
    reportable: "yes"
    channel_ref: diss-incident
  - id: tsq.foreign-roommate
    event: "Foreign national roommate"
    reportable: "yes"
    channel_ref: diss-incident
