name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: run_tests.py (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      # The scripts run on the standard library plus PyYAML (README, USAGE).
      - name: Install PyYAML
        run: python -m pip install pyyaml

      - name: Install Node dev dependencies
        run: npm ci

      # No DCSA Library, no Cloudflare credentials and no network are needed:
      # the suite builds an approved synthetic release from
      # tests/fixtures/mini-library (tests/approved_fixture.py,
      # tests/mcp/build_fixture_release.py) and the node tests use fake D1
      # shards over node:sqlite.
      - name: Run the regression suite
        run: python tests/run_tests.py
